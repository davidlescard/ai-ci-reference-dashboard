services:
  jenkins:
    build: .
    container_name: qgl-jenkins
    # Lab setup: root lets the container use the host Docker socket. Do not copy this to a shared server.
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Copy .env.example to .env and set it}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
      GITHUB_USER: ${GITHUB_USER:?Copy .env.example to .env and set it}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?Copy .env.example to .env and set it}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
